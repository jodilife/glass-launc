name: Android APK

on:
  push:
    branches: [main, feature/entertainment-dashboard, experiment/live-tv-wallpaper-service]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore shared debug keystore (when configured)
        env:
          GLASSTV_DEBUG_KEYSTORE_BASE64: ${{ secrets.GLASSTV_DEBUG_KEYSTORE_BASE64 }}
          GLASSTV_DEBUG_STORE_PASSWORD: ${{ secrets.GLASSTV_DEBUG_STORE_PASSWORD }}
          GLASSTV_DEBUG_KEY_ALIAS: ${{ secrets.GLASSTV_DEBUG_KEY_ALIAS }}
          GLASSTV_DEBUG_KEY_PASSWORD: ${{ secrets.GLASSTV_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$GLASSTV_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Shared debug keystore is not configured; using the standard Gradle debug key for this build."
            exit 0
          fi

          printf '%s' "$GLASSTV_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          chmod 600 app/debug.keystore
          echo "GLASSTV_DEBUG_STORE_PASSWORD=${GLASSTV_DEBUG_STORE_PASSWORD:-android}" >> "$GITHUB_ENV"
          echo "GLASSTV_DEBUG_KEY_ALIAS=${GLASSTV_DEBUG_KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
          echo "GLASSTV_DEBUG_KEY_PASSWORD=${GLASSTV_DEBUG_KEY_PASSWORD:-android}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Dashboard-Test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
