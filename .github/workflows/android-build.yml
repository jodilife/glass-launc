name: Android APK

on:
  push:
    branches: [main, feature/entertainment-dashboard, experiment/live-tv-wallpaper-service]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A stable shared key is restored from Actions Secrets when available.
      # On the first build only, generate one and export it as a setup artifact.
      - name: Prepare stable debug keystore
        id: prepare_debug_keystore
        env:
          GLASSTV_DEBUG_KEYSTORE_BASE64: ${{ secrets.GLASSTV_DEBUG_KEYSTORE_BASE64 }}
          GLASSTV_DEBUG_STORE_PASSWORD: ${{ secrets.GLASSTV_DEBUG_STORE_PASSWORD }}
          GLASSTV_DEBUG_KEY_ALIAS: ${{ secrets.GLASSTV_DEBUG_KEY_ALIAS }}
          GLASSTV_DEBUG_KEY_PASSWORD: ${{ secrets.GLASSTV_DEBUG_KEY_PASSWORD }}
        run: |
          mkdir -p app
          if [ -n "$GLASSTV_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$GLASSTV_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "No shared key was configured. Generating the one-time GlassTV debug key."
            keytool -genkeypair -noprompt -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GlassTV Debug,O=GlassTV,C=ID"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi
          chmod 600 app/debug.keystore
          echo "GLASSTV_DEBUG_STORE_PASSWORD=${GLASSTV_DEBUG_STORE_PASSWORD:-android}" >> "$GITHUB_ENV"
          echo "GLASSTV_DEBUG_KEY_ALIAS=${GLASSTV_DEBUG_KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
          echo "GLASSTV_DEBUG_KEY_PASSWORD=${GLASSTV_DEBUG_KEY_PASSWORD:-android}" >> "$GITHUB_ENV"
          keytool -list -keystore app/debug.keystore \
            -storepass "${GLASSTV_DEBUG_STORE_PASSWORD:-android}" \
            -alias "${GLASSTV_DEBUG_KEY_ALIAS:-androiddebugkey}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Export one-time debug keystore setup
        if: ${{ steps.prepare_debug_keystore.outputs.bootstrap == 'true' }}
        run: |
          mkdir -p app/build/keystore-setup
          cp app/debug.keystore app/build/keystore-setup/glasstv-debug.keystore
          chmod 600 app/build/keystore-setup/glasstv-debug.keystore

      - name: Upload one-time debug keystore setup
        if: ${{ steps.prepare_debug_keystore.outputs.bootstrap == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Debug-Keystore-Setup
          path: app/build/keystore-setup/glasstv-debug.keystore
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Dashboard-Test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
